version: 2.1

executors:
  my-executor:
    resource_class: large
    docker:
      - image: cimg/ruby:3.2.5-browsers

jobs:
  install_ruby_deps:
    executor: my-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - gem-cache-{{ checksum "Gemfile.lock" }}
      - run:
          name: Install ruby dependencies
          command: |
            gem update --system
            gem install bundler
            bundle config set --local path 'vendor/bundle'
            bundle install --jobs=4 --retry=3
      - run:
          name: Install scss_lint
          command: gem install scss_lint
      - save_cache:
          key: gem-cache-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle
      - persist_to_workspace:
          root: ~/project
          paths:
            - "vendor/bundle"
  install_node_deps:
    executor: my-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-cache-{{ checksum "package-lock.json" }}
      - run:
          name: Install node dependencies
          command: npm ci
      - save_cache:
          key: npm-cache-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - persist_to_workspace:
          root: ~/project
          paths:
            - "node_modules"
  build:
    executor: my-executor
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - restore_cache:
          keys:
            - npm-cache-{{ checksum "package-lock.json" }}
      - restore_cache:
          keys:
            - gem-cache-{{ checksum "Gemfile.lock" }}
            - gem-cache
      - run:
          name: Build site assets
          command: npm run build:all-assets
      - run:
          name: Build static site
          command: |
            bundle config set --local path '~/project/vendor/bundle'
            bundle exec jekyll build
      - persist_to_workspace:
          root: ~/project
          paths:
            - "_site"
            - "assets"
            - "node_modules"
  test_build:
    executor: my-executor
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Run rspec
          command: |
            bundle config set --local path '~/project/vendor/bundle'
            bundle exec rspec
  test_a11y_desktop:
    executor: my-executor
    parallelism: 2
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Link bundler
          command: |
            bundle config set --local path '~/project/vendor/bundle'
      # --skip-initial-build: `_site`/`assets` are already built and attached
      # from the `build` job's workspace, so this just serves them. Without
      # this flag, `jekyll serve` rebuilds from source on startup — which
      # each of the 2 parallel containers here would do redundantly.
      # The curl loop waits for --detach's background server to actually be
      # ready before pa11y-ci starts hitting it.
      # pa11y-ci:shard (not pa11y-ci:sitemap) is what makes parallelism: 2
      # above actually cut time to completion when using a sharded sitemap.
      - run:
          name: Run pa11y-ci desktop
          command: |
            bundle exec jekyll serve --detach --host=localhost --skip-initial-build
            until curl -sf http://localhost:4000/sitemap.xml -o /dev/null; do sleep 1; done
            npm run pa11y-ci:shard
  test_a11y_mobile:
    executor: my-executor
    parallelism: 2
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Link bundler
          command: |
            bundle config set --local path '~/project/vendor/bundle'
      # Same reasoning as test_a11y_desktop's "Run pa11y-ci desktop" step.
      - run:
          name: Run pa11y-ci mobile
          command: |
            bundle exec jekyll serve --detach --host=localhost --skip-initial-build
            until curl -sf http://localhost:4000/sitemap.xml -o /dev/null; do sleep 1; done
            npm run pa11y-ci:shard-mobile

workflows:
  circle-uswds-site:
    jobs:
      - install_ruby_deps
      - install_node_deps
      - build:
          requires:
            - install_ruby_deps
            - install_node_deps
      - test_build:
          requires:
            - build
      - test_a11y_desktop:
          requires:
            - build
      - test_a11y_mobile:
          requires:
            - build
