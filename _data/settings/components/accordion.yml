name: Accordion
contents:
  - name: Border width
    description: Border width of the bordered accordion.
    var: $theme-accordion-border-width
    default: 0.5
    type: units
  - name: Border color
    description: Border color of the bordered accordion.
    var: $theme-accordion-border-color
    default: '"base-lightest"'
    type: color
  - name: Font family
    description: Font family of the accordion.
    var: $theme-accordion-font-family
    default: '"body"'
    type: family
  - name: Icon position
    description: Logical side of the expand/collapse icon on accordion buttons. Allowed values are `"start"` (default) or `"end"`. Uses logical sides so placement works in LTR and RTL. Per-accordion modifiers (`usa-accordion--icon-start`, `usa-accordion--icon-end`) override this setting.
    var: $theme-accordion-icon-position
    default: '"start"'
    type: string
