<h3 class="site-preview-heading">Error (default)</h3>
<div class="padding-x-205">
  <div class="usa-form-group usa-form-group--error">
    <fieldset
      class="usa-fieldset"
      aria-describedby="error-example-historical-figures-error"
      aria-invalid="true"
    >
      <legend class="usa-legend usa-legend">
        Select one historical figure
      </legend>
      <span
        class="usa-error-message"
        id="error-example-historical-figures-error"
        >Select a historical figure.</span
      >
      <div class="usa-radio">
        <input
          class="usa-radio__input"
          id="error-example-historical-truth"
          type="radio"
          name="error-example-historical-figures"
          value="sojourner-truth"
        />
        <label class="usa-radio__label" for="error-example-historical-truth"
          >Sojourner Truth</label
        >
      </div>
      <div class="usa-radio">
        <input
          class="usa-radio__input"
          id="error-example-historical-douglass"
          type="radio"
          name="error-example-historical-figures"
          value="frederick-douglass"
        />
        <label class="usa-radio__label" for="error-example-historical-douglass"
          >Frederick Douglass</label
        >
      </div>
      <div class="usa-radio">
        <input
          class="usa-radio__input"
          id="error-example-historical-washington"
          type="radio"
          name="error-example-historical-figures"
          value="booker-t-washington"
        />
        <label
          class="usa-radio__label"
          for="error-example-historical-washington"
          >Booker T. Washington</label
        >
      </div>
      <div class="usa-radio">
        <input
          class="usa-radio__input"
          id="error-example-historical-carver"
          type="radio"
          name="error-example-historical-figures"
          value="george-washington-carver"
          disabled=""
        />
        <label class="usa-radio__label" for="error-example-historical-carver"
          >George Washington Carver</label
        >
      </div>
    </fieldset>
  </div>
</div>
<h3 class="site-preview-heading">Error (tile)</h3>
<div class="padding-x-205">
  <form class="usa-form">
    <div class="usa-form-group usa-form-group--error">
      <fieldset
        class="usa-fieldset"
        aria-describedby="error-example-tile-historical-figures-error"
        aria-invalid="true"
      >
        <legend class="usa-legend">Select one historical figure</legend>
        <span
          class="usa-error-message"
          id="error-example-tile-historical-figures-error"
          >Select a historical figure.</span
        >
        <div class="usa-radio">
          <input
            class="usa-radio__input usa-radio__input--tile"
            id="error-example-tile-historical-truth-2"
            type="radio"
            name="error-example-tile-historical-figures-2"
            value="sojourner-truth"
          />
          <label
            class="usa-radio__label"
            for="error-example-tile-historical-truth-2"
            >Sojourner Truth</label
          >
        </div>
        <div class="usa-radio">
          <input
            class="usa-radio__input usa-radio__input--tile"
            id="error-example-tile-historical-douglass-2"
            type="radio"
            name="error-example-tile-historical-figures-2"
            value="frederick-douglass"
          />
          <label
            class="usa-radio__label"
            for="error-example-tile-historical-douglass-2"
            >Frederick Douglass
            <span class="usa-checkbox__label-description"
              >This is optional text that can be used to describe the label in
              more detail.</span
            ></label
          >
        </div>
        <div class="usa-radio">
          <input
            class="usa-radio__input usa-radio__input--tile"
            id="error-example-tile-historical-washington-2"
            type="radio"
            name="error-example-tile-historical-figures-2"
            value="booker-t-washington"
          />
          <label
            class="usa-radio__label"
            for="error-example-tile-historical-washington-2"
            >Booker T. Washington</label
          >
        </div>
        <div class="usa-radio">
          <input
            class="usa-radio__input usa-radio__input--tile"
            id="error-example-tile-historical-carver-2"
            type="radio"
            name="error-example-tile-historical-figures-2"
            value="george-washington-carver"
            disabled=""
          />
          <label
            class="usa-radio__label"
            for="error-example-tile-historical-carver-2"
            >George Washington Carver</label
          >
        </div>
      </fieldset>
    </div>
  </form>
</div>
