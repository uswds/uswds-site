version: 2.1

executors:
  my-executor:
    resource_class: large
    docker:
      - image: cimg/ruby:3.2.5-browsers

commands:
  install_node:
    description: >
      cimg/ruby bundles a fixed, older Node version with no ESM require()
      support. Install nvm and switch to the Node version in .nvmrc so
      npm/npx steps (including @uswds/uswds's own build script) work.
    steps:
      - run:
          name: Install Node via nvm (from .nvmrc)
          command: |
            set +e
            wget -qO- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.6/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            NODE_VERSION="$(cat .nvmrc)"
            nvm install "$NODE_VERSION"
            nvm alias default "$NODE_VERSION"
            echo 'export NVM_DIR="$HOME/.nvm"' >> "$BASH_ENV"
            echo '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"' >> "$BASH_ENV"

jobs:
  install_ruby_deps:
    executor: my-executor
    steps:
      - checkout
      # Fallback keys allow partial cache hits when the lock file changes.
      # Bump v1- to invalidate all caches.
      - restore_cache:
          name: Restore gem cache
          keys:
            - v1-gem-cache-{{ arch }}-{{ .Branch }}-{{ checksum "Gemfile.lock" }}
            - v1-gem-cache-{{ arch }}-{{ .Branch }}-
            - v1-gem-cache-{{ arch }}-
      - run:
          name: Install ruby dependencies
          command: |
            gem update --system
            gem install bundler
            bundle config set --local path 'vendor/bundle'
            bundle install --jobs=4 --retry=3
      - run:
          name: Install scss_lint
          command: gem install scss_lint
      # Drop stale gems left by a partial cache restore.
      - run:
          name: Clean stale gems
          command: bundle clean --force
      - save_cache:
          name: Save gem cache
          key: v1-gem-cache-{{ arch }}-{{ .Branch }}-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle
      - persist_to_workspace:
          root: ~/project
          paths:
            - "vendor/bundle"
  install_node_deps:
    executor: my-executor
    steps:
      - checkout
      - install_node
      # Fallback keys allow partial cache hits when the lock file changes.
      - restore_cache:
          name: Restore npm cache
          keys:
            - v1-node-{{ .Branch }}-{{ checksum "package-lock.json" }}
            - v1-node-{{ .Branch }}-
            - v1-node-
      - run:
          name: Install node dependencies
          command: npm ci
      # Cache npm's download store, not node_modules; npm ci rebuilds node_modules from it.
      - save_cache:
          name: Save npm cache
          key: v1-node-{{ .Branch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - persist_to_workspace:
          root: ~/project
          paths:
            - "node_modules"
  build:
    executor: my-executor
    steps:
      - checkout
      # Deps come from the workspace; no cache restore needed here.
      - attach_workspace:
          at: ~/project
      - install_node
      - run:
          name: Build site assets
          command: npm run build:all-assets
      - run:
          name: Build static site
          command: |
            bundle config set --local path '~/project/vendor/bundle'
            bundle exec jekyll build
      - persist_to_workspace:
          root: ~/project
          paths:
            - "_site"
            - "assets"
            - "node_modules"
  test_build:
    executor: my-executor
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Run rspec
          command: |
            bundle config set --local path '~/project/vendor/bundle'
            bundle exec rspec
  test_a11y_desktop:
    executor: my-executor
    parallelism: 2
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - install_node
      - run:
          name: Link bundler
          command: |
            bundle config set --local path '~/project/vendor/bundle'
      # --skip-initial-build: `_site`/`assets` are already built and attached
      # from the `build` job's workspace, so this just serves them. Without
      # this flag, `jekyll serve` rebuilds from source on startup — which
      # each of the 2 parallel containers here would do redundantly.
      # The curl loop waits for --detach's background server to actually be
      # ready before pa11y-ci starts hitting it.
      # pa11y-ci:shard (not pa11y-ci:sitemap) is what makes parallelism: 2
      # above actually cut time to completion when using a sharded sitemap.
      - run:
          name: Run pa11y-ci desktop
          command: |
            bundle exec jekyll serve --detach --host=localhost --skip-initial-build
            until curl -sf http://localhost:4000/sitemap.xml -o /dev/null; do sleep 1; done
            npm run pa11y-ci:shard
  test_a11y_mobile:
    executor: my-executor
    parallelism: 2
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - install_node
      - run:
          name: Link bundler
          command: |
            bundle config set --local path '~/project/vendor/bundle'
      # Same reasoning as test_a11y_desktop's "Run pa11y-ci desktop" step.
      - run:
          name: Run pa11y-ci mobile
          command: |
            bundle exec jekyll serve --detach --host=localhost --skip-initial-build
            until curl -sf http://localhost:4000/sitemap.xml -o /dev/null; do sleep 1; done
            npm run pa11y-ci:shard-mobile
  # /components/icon/ is excluded from the sharded desktop/mobile crawls above
  # (it renders all ~243 icons and exceeds pa11y's default 120s timeout). This
  # dedicated job scans that one URL on its own with a longer timeout and
  # concurrency: 1 (see .pa11yci--icon) so the page still gets full a11y
  # coverage without blowing the main jobs' time budget. Not parallelized —
  # it's a single URL.
  test_a11y_icon:
    executor: my-executor
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - install_node
      - run:
          name: Link bundler
          command: |
            bundle config set --local path '~/project/vendor/bundle'
      - run:
          name: Run pa11y-ci icon page
          command: |
            bundle exec jekyll serve --detach --host=localhost --skip-initial-build
            until curl -sf http://localhost:4000/sitemap.xml -o /dev/null; do sleep 1; done
            npm run pa11y-ci:icon

workflows:
  circle-uswds-site:
    jobs:
      - install_ruby_deps
      - install_node_deps
      - build:
          requires:
            - install_ruby_deps
            - install_node_deps
      - test_build:
          requires:
            - build
      - test_a11y_desktop:
          requires:
            - build
      - test_a11y_mobile:
          requires:
            - build
      - test_a11y_icon:
          requires:
            - build
