name: Accordion
contents:
  - name: Border width
    description: Border width of the bordered accordion.
    var: $theme-accordion-border-width
    default: 0.5
    type: units
  - name: Border color
    description: Border color of the bordered accordion.
    var: $theme-accordion-border-color
    default: '"base-lightest"'
    type: color
  - name: Font family
    description: Font family of the accordion.
    var: $theme-accordion-font-family
    default: '"body"'
    type: family
  - name: Icon position
    description: Position of the expand/collapse icon on accordion buttons. Allowed values are `"right"` (default) or `"left"`. Per-accordion modifiers (`usa-accordion--icon-left`, `usa-accordion--icon-right`) override this setting.
    var: $theme-accordion-icon-position
    default: '"right"'
    type: string
