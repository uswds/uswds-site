<h3 class="site-preview-heading">Error with hint</h3>
<div class="padding-x-205">
  <div class="usa-form-group usa-form-group--error">
    <fieldset class="usa-fieldset">
      <legend class="usa-legend">Date of Birth</legend>
      <span
        class="usa-hint"
        aria-hidden="true"
        id="error-example-memorable-date-hint"
      >
        Select a month. Enter 1 or 2 digits for the day and 4 digits for the
        year.
      </span>
      <span class="usa-error-message" id="error-example-memorable-date-error"
        >Enter a valid date of birth.</span
      >
      <div class="usa-memorable-date">
        <div
          class="usa-form-group usa-form-group--month usa-form-group--select"
        >
          <label class="usa-label" for="error-example-memorable-date-month"
            >Month</label
          >
          <span
            class="usa-hint usa-sr-only"
            id="error-example-memorable-date-month-hint"
            >Select a month from the dropdown.</span
          >
          <select
            class="usa-select usa-input--error"
            id="error-example-memorable-date-month"
            name="error-example-memorable-date-month"
            aria-describedby="error-example-memorable-date-month-hint error-example-memorable-date-error"
            aria-invalid="true"
          >
            <option value="">- Select -</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>
        <div class="usa-form-group usa-form-group--day">
          <label class="usa-label" for="error-example-memorable-date-day"
            >Day</label
          >
          <span
            class="usa-hint usa-sr-only"
            id="error-example-memorable-date-day-hint"
            >Enter 1 or 2 digits for the day.</span
          >
          <input
            class="usa-input usa-input--error"
            aria-describedby="error-example-memorable-date-day-hint error-example-memorable-date-error"
            aria-invalid="true"
            id="error-example-memorable-date-day"
            name="error-example-memorable-date-day"
            maxlength="2"
            pattern="[0-9]*"
            inputmode="numeric"
            value=""
          />
        </div>
        <div class="usa-form-group usa-form-group--year">
          <label class="usa-label" for="error-example-memorable-date-year"
            >Year</label
          >
          <span
            class="usa-hint usa-sr-only"
            id="error-example-memorable-date-year-hint"
            >Enter 4 digits for the year.</span
          >
          <input
            class="usa-input usa-input--error"
            aria-describedby="error-example-memorable-date-year-hint error-example-memorable-date-error"
            aria-invalid="true"
            id="error-example-memorable-date-year"
            name="error-example-memorable-date-year"
            minlength="4"
            maxlength="4"
            pattern="[0-9]*"
            inputmode="numeric"
            value=""
          />
        </div>
      </div>
    </fieldset>
  </div>
</div>
